services:
  # Web Service
  - type: web
    name: fluxport-backend
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fluxport-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: https://flux-port.vercel.app
        sync: false

databases:
  # PostgreSQL Database
  - name: fluxport-db
    databaseName: fluxport
    user: fluxport_user
    plan: free
    region: oregon
